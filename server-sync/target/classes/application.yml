spring:
  application:
    name: server-sync
  datasource:
    url: jdbc:sqlite:${user.home}/.luddite/server/photos.db?mode=rwc
    driver-class-name: org.sqlite.JDBC
  jdbc:
    template:
      query-timeout: 5
  flyway:
    enabled: true
    locations: classpath:db/migration


  server:
    port: 9999