spring:
  application:
    name: server-sync
  datasource:
    url: jdbc:sqlite:${user.home}/.luddite/server/photos.db
    driver-class-name: org.sqlite.JDBC
  jdbc:
    template:
      query-timeout: 5
  flyway:
    enabled: false


sync:
  server:
    root-dirs: [ ]
  dns:
    # Your DuckDNS subdomain (without .duckdns.org) — e.g. "luddite-sync" for luddite-sync.duckdns.org
    domain: luddite-sync
    # Your DuckDNS token — find it at https://www.duckdns.org after logging in
    token: 83b58635-8e13-4337-b5ab-027f58eae593
  socket:
    port: 8888
    keystore: classpath:server-keystore.p12
    truststore: classpath:truststore.p12
    password: ${KEYSTORE_PASSWORD}
    pending-ack-ttl-ms: 20000

