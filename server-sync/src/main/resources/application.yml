spring:
  application:
    name: server-sync
  datasource:
    url: jdbc:sqlite:${user.home}/.luddite/server/photos.db
    driver-class-name: org.sqlite.JDBC
  jdbc:
    template:
      query-timeout: 5
  flyway:
    enabled: false

  server:
    port: 9999

sync:
  server:
    root-dirs: [ ]
  dns:
    # Your DuckDNS subdomain (without .duckdns.org) — e.g. "luddite-sync" for luddite-sync.duckdns.org
    domain: luddite-sync
    # Your DuckDNS token — find it at https://www.duckdns.org after logging in
    token: ${LUDDITE_DUCKDNS_TOKEN:}
  socket:
    port: 8888
    keystore: classpath:server-keystore.p12
    truststore: classpath:truststore.p12
    password: fichony123!
    # How long to wait for a client ACK before giving up and letting the client retry on reconnect.
    # Increase this on slow connections or when syncing large files.
    pending-ack-ttl-ms: 20000

