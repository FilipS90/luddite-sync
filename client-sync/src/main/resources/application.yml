spring:
  application:
    name: client-sync
  datasource:
    url: jdbc:sqlite:${user.home}/.luddite/client/photos.db?mode=rwc
    driver-class-name: org.sqlite.JDBC
  jdbc:
    template:
      query-timeout: 5
  flyway:
    enabled: true
    locations: classpath:db/migration

sync:
  server:
    host: localhost
    port: 8888
  client:
    mirror-dir: ${user.home}/.luddite
    dirs:
      - photos
  socket:
    keystore: classpath:client-keystore.p12
    truststore: classpath:truststore.p12
    password: fichony123!

