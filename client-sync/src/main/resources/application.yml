spring:
  application:
    name: client-sync
  datasource:
    url: jdbc:sqlite:${user.home}/.luddite/client/sync.db
    driver-class-name: org.sqlite.JDBC
  jdbc:
    template:
      query-timeout: 5

sync:
  server:
    # FOR LOCAL TESTING HOST NEEDS TO BE LOCALHOST
    host: luddite-server
    port: 8888
    api-url: http://${sync.server.host}:8080
  client:
    mirror-dir: ${user.home}/.luddite
    retain-local-directory: true
    ui: swing
    name: luddite-client
