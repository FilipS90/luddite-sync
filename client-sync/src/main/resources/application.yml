spring:
  application:
    name: client-sync
  datasource:
    url: jdbc:sqlite:${user.home}/.luddite/client/sync.db
    driver-class-name: org.sqlite.JDBC
  jdbc:
    template:
      query-timeout: 5
  flyway:
    enabled: false

sync:
  server:
    host: luddite-sync.duckdns.org
    port: 8888
  client:
    mirror-dir: ${user.home}/.luddite
  socket:
    keystore: classpath:client-keystore.p12
    truststore: classpath:truststore.p12
    password: ${KEYSTORE_PASSWORD}

